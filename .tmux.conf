set-option -g default-shell /bin/zsh
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

set-option -g focus-events on
set-option -sg escape-time 10
set-option -sa terminal-overrides ',screen:RGB'

# copy mode
set-window-option -g mode-keys vi
set-option -g default-command "exec reattach-to-user-namespace -l $SHELL"
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

bind | split-window -h

# active window color
set-option -g window-active-style 'bg=#000000'

# non-active window color
set-option -g window-style 'bg=#333333'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

# status-bar
set-option -g status-position top
#set-option -g status-left-length 90
#set-option -g status-right-length 100
#set-option -g status-right '#(~/.tmux/get_ssid) #(~/.tmux/get_battery) %Y-%m-%d %a. %H:%M '
set-option -g status-interval 1
set-option -g status-bg "colour250"

set -g @dracula-plugins "cwd git battery cpu-usage gpu-usage ram-usage"
set -g @dracula-cpu-usage-colors "pink dark_gray"
set -g @dracula-border-contrast true
set -g @dracula-show-powerline true
set -g @dracula-show-edge-icons false
#set -g @dracula-transparent-powerline-bg true
set -g @dracula-cwd-max-dirs "0"
set -g @dracula-cwd-max-chars "0"
set -g @dracula-cpu-arch-label "󰍛 "
set -g @dracula-show-left-icon "#h | #S | #W"

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
